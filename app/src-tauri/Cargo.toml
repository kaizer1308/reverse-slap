[package]
name = "reverse-slop-ui"
version = "0.1.0"
description = "reverse-slop workbench front end"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "reverse_slop_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Job object (kill-on-close) plus the elevation probe. The engine holds a kernel
# driver open, so "the UI died, the engine must die too" has to be enforced by
# the OS rather than by a watchdog we hope gets to run.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# Keeps `tauri build --features custom-protocol` working with the default setup.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
