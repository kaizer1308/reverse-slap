name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-fast Rust: local Cargo.toml keeps lto=true + codegen-units=1 for max
  # runtime perf, CI overrides for link speed (~2-4 min saved).
  # sccache requires incremental compilation disabled in every job.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: false
  CARGO_PROFILE_RELEASE_STRIP: true
  CARGO_NET_RETRY: 10
  CMAKE_DISABLE_FIND_PACKAGE_PkgConfig: TRUE
  CMAKE_DISABLE_FIND_PACKAGE_Doxygen: TRUE
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # C++ engine + mapper only, no tests, no frontend.
  # Critical path: ~2-4 min warm (sccache + _ext hit) vs 5-8 min cold.
  cxx:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@v4
        with:
          path: |
            _ext/*-src
            _ext/frida-devkit
          key: ext-sources-v2-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v2-${{ runner.os }}-

      - name: build cxx (no tests, no frontend)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "reverse-slop-engine,slop_mapper" -CmakeExtra "-DSLOP_BUILD_TESTS=OFF -DSLOP_BUILD_TEST_TARGET=OFF"

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats || true

      - name: upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cxx-artifacts
          compression-level: 0
          path: |
            build/src/engine/reverse-slop-engine.exe
            build/src/engine/slop_frida.dll
            build/mapper/slop_mapper.exe
          if-no-files-found: error

  # Kernel driver only. Parallel with cxx (~1-2 min + kits).
  driver:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: cache windows kits 26100
        id: kits-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0
            C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0
            C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0
          key: kits-26100-${{ runner.os }}-v1

      - name: install windows sdk 26100
        if: steps.kits-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o sdksetup.exe "https://go.microsoft.com/fwlink/?linkid=2338977"
          $p = Start-Process -FilePath ".\sdksetup.exe" -ArgumentList "/q","/norestart","/ceip","off" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "sdksetup failed: $($p.ExitCode)" }

      - name: install wdk 26100
        if: steps.kits-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o wdksetup.exe "https://go.microsoft.com/fwlink/?linkid=2335869"
          $p = Start-Process -FilePath ".\wdksetup.exe" -ArgumentList "/q","/norestart","/ceip","off" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "wdksetup failed: $($p.ExitCode)" }

      - name: build driver
        shell: pwsh
        run: powershell -NoProfile -File tools\build_slopdrvr.ps1

      - name: upload driver
        uses: actions/upload-artifact@v4
        with:
          name: driver-artifact
          path: build/driver/slopdrvr.sys
          if-no-files-found: error

  # Tests run parallel, never block the bundle.
  tests:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@v4
        with:
          path: |
            _ext/*-src
            _ext/frida-devkit
          key: ext-sources-v2-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v2-${{ runner.os }}-

      - name: build + run tests (no frontend)
        shell: pwsh
        run: |
          powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "slop_tests,slop_decomp_target_o0,slop_decomp_target_o2" -CmakeExtra "-DSLOP_BUILD_TESTS=ON -DSLOP_BUILD_TEST_TARGET=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure

  # Compile the real frontend immediately, independently of native sidecars.
  frontend-build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: sccache (rustc wrapper)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: setup node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: rust cache (target/ + registry)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          shared-key: frontend-release-v2

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-v2-${{ runner.os }}-22-${{ hashFiles('app/package-lock.json') }}

      - name: compile frontend (no sidecars, no installer)
        shell: pwsh
        run: ./tools/build_frontend_binary.ps1

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: upload frontend binary
        uses: actions/upload-artifact@v4
        with:
          name: frontend-binary
          compression-level: 0
          path: app/src-tauri/target/release/reverse-slop-ui.exe
          if-no-files-found: error

  # Only packaging waits: no Rust or C++ compilation on this job's critical path.
  frontend:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [cxx, driver, frontend-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: setup node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: cache node_modules (exact lockfile only)
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-v2-${{ runner.os }}-22-${{ hashFiles('app/package-lock.json') }}

      - name: download frontend binary
        uses: actions/download-artifact@v4
        with:
          name: frontend-binary
          path: app/src-tauri/target/release

      - name: cache magicmida (unpacker zips)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/reverse-slop/tools/magicmida
          key: magicmida-2026-05-14-v1
          restore-keys: |
            magicmida-

      - name: download cxx artifacts
        uses: actions/download-artifact@v4
        with:
          name: cxx-artifacts
          path: _staging/cxx

      - name: download driver artifact
        uses: actions/download-artifact@v4
        with:
          name: driver-artifact
          path: _staging/driver

      - name: stage build tree for tauri resource map
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/src/engine, build/mapper, build/driver | Out-Null
          # upload-artifact preserves subdirs (build/...) on some versions and
          # flattens on others — search recursively so both layouts work.
          function Find-Staged($root, $name) {
            $f = Get-ChildItem -Path $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $f) { throw "staged file missing: $name under $root" }
            return $f.FullName
          }
          Copy-Item -LiteralPath (Find-Staged _staging/cxx 'reverse-slop-engine.exe') -Destination build/src/engine/reverse-slop-engine.exe -Force
          Copy-Item -LiteralPath (Find-Staged _staging/cxx 'slop_frida.dll') -Destination build/src/engine/slop_frida.dll -Force
          Copy-Item -LiteralPath (Find-Staged _staging/cxx 'slop_mapper.exe') -Destination build/mapper/slop_mapper.exe -Force
          Copy-Item -LiteralPath (Find-Staged _staging/driver 'slopdrvr.sys') -Destination build/driver/slopdrvr.sys -Force
          Get-ChildItem build/src/engine, build/mapper, build/driver

      - name: bundle precompiled frontend and native artifacts
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -FrontendOnly -BundleOnly -FastBundle -SkipDriver -Full -OnlineWebview

      - name: upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: reverse-slop-portable
          compression-level: 0
          path: |
            dist/reverse-slop/reverse-slop.exe
            dist/reverse-slop/engine
          if-no-files-found: error

      - name: upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: reverse-slop-setup
          compression-level: 0
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
